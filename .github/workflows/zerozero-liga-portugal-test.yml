name: Teste zerozero - Liga Portugal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-zerozero:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testar classificação da Liga Portugal no zerozero
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';

          const URL = 'https://www.zerozero.pt/competicao/liga-portuguesa';
          const headers = {
            'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36',
            'accept-language': 'pt-PT,pt;q=0.9,en;q=0.6',
            'accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          };

          const clean = s => String(s ?? '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
          const norm = s => clean(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
          const num = s => {
            const m = clean(s).match(/-?\d+/);
            return m ? Number(m[0]) : null;
          };

          console.log(`A pedir: ${URL}`);
          const response = await fetch(URL, { headers, redirect: 'follow' });
          const html = await response.text();

          console.log(`HTTP: ${response.status}`);
          console.log(`URL final: ${response.url}`);
          console.log(`Content-Type: ${response.headers.get('content-type') || '(sem content-type)'}`);
          console.log(`HTML recebido: ${html.length} bytes`);

          if (!response.ok) {
            console.log('Início da resposta:');
            console.log(clean(html.slice(0, 1200)));
            throw new Error(`O zerozero respondeu HTTP ${response.status}. Não será tentado qualquer contorno de proteção.`);
          }

          const $ = cheerio.load(html);
          const tables = [];

          $('table').each((index, table) => {
            const $table = $(table);
            const headers = $table.find('tr').first().find('th,td').map((_, el) => norm($(el).text())).get();
            const allText = norm($table.text());
            const score = ['P','J','V','E','D','GM','GS','DG'].filter(h => headers.includes(h) || allText.includes(` ${h} `)).length;
            if (score >= 5) tables.push({ index, table, headers, score });
          });

          if (!tables.length) {
            const body = norm($('body').text());
            console.log(`Página contém "CLASSIFICACAO": ${body.includes('CLASSIFICACAO')}`);
            throw new Error('A página abriu, mas não encontrei uma tabela classificativa reconhecível no HTML recebido.');
          }

          tables.sort((a,b) => b.score - a.score);
          const chosen = tables[0];
          const rows = [];

          $(chosen.table).find('tr').each((_, tr) => {
            const cells = $(tr).find('td').map((__, td) => clean($(td).text())).get().filter(Boolean);
            if (cells.length < 8) return;

            const posIndex = cells.findIndex(x => /^\d+$/.test(x));
            if (posIndex < 0) return;

            let teamIndex = -1;
            for (let i = posIndex + 1; i < cells.length; i++) {
              if (!/^[+-]?\d+$/.test(cells[i]) && /[A-Za-zÀ-ÿ]/.test(cells[i])) {
                teamIndex = i;
                break;
              }
            }
            if (teamIndex < 0) return;

            const numeric = cells.slice(teamIndex + 1).map(num).filter(v => v !== null);
            if (numeric.length < 7) return;

            const [points, played, wins, draws, losses, gf, ga] = numeric;
            const row = {
              pos: Number(cells[posIndex]),
              team: cells[teamIndex],
              points, played, wins, draws, losses, gf, ga,
              gd: gf - ga
            };
            if (row.pos > 0 && row.pos < 30 && row.team) rows.push(row);
          });

          const unique = [...new Map(rows.map(r => [`${r.pos}|${r.team}`, r])).values()].sort((a,b) => a.pos - b.pos);

          if (unique.length < 10) {
            console.log('Cabeçalhos detetados:', chosen.headers.join(' | '));
            console.log('Linhas candidatas:', JSON.stringify(unique, null, 2));
            throw new Error(`Acesso ao zerozero funcionou, mas só consegui interpretar ${unique.length} equipas.`);
          }

          console.log('\nCLASSIFICAÇÃO DETETADA NO ZEROZERO\n');
          console.table(unique.map(r => ({
            '#': r.pos,
            Equipa: r.team,
            P: r.points,
            J: r.played,
            V: r.wins,
            E: r.draws,
            D: r.losses,
            GM: r.gf,
            GS: r.ga,
            DG: r.gd
          })));

          console.log(`\nSUCESSO: ${unique.length} equipas lidas diretamente do zerozero.`);
          NODE
